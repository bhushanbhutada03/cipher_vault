<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Brass -->
    <linearGradient id="brass" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E1BE69"/>
      <stop offset="50%" stop-color="#C9962E"/>
      <stop offset="100%" stop-color="#E1BE69"/>
    </linearGradient>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#262620"/>
      <stop offset="45%" stop-color="#1A202B"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="13"
    fill="url(#bg)"
  />

  <!-- Outer Ring -->
  <circle
    cx="32"
    cy="32"
    r="25"
    fill="#1B2230"
    stroke="url(#brass)"
    stroke-width="5"
  />

  <!-- Inner Ring -->
  <circle
    cx="32"
    cy="32"
    r="17"
    fill="none"
    stroke="#D8B45A"
    stroke-opacity=".72"
    stroke-width="2.5"
  />

  <!-- Vault -->
  <path
    d="M32 18a14 14 0 0 1 8 25.5V50a8 8 0 0 1-16 0v-6.5A14 14 0 0 1 32 18Z"
    fill="url(#brass)"
  />
</svg>